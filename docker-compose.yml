# Local stack: `docker compose up -d`, then run migrations and seed (see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hardware_store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d hardware_store"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hardware_store
      DB_USER: store
      DB_PASSWORD: store
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-now
    ports:
      - "8080:80"

volumes:
  pgdata:
